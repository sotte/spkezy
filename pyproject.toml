[project]
name = "parakeet-dictation"
version = "0.1.0"
description = "Free, open-source local AI dictation using NVIDIA NeMo Parakeet TDT 0.6B v3"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nemo_toolkit[asr]",
    "pyaudio",
    "numpy<2.0",
    "pyperclip",
    "structlog",
]

[project.optional-dependencies]
cpu = [
    "torch",
    "torchaudio",
    "torchvision",
]
cuda = [
    "torch",
    "torchaudio",
    "torchvision",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "extra == 'cpu'" },
    { index = "pytorch-cuda", marker = "extra == 'cuda'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "extra == 'cpu'" },
    { index = "pytorch-cuda", marker = "extra == 'cuda'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "extra == 'cpu'" },
    { index = "pytorch-cuda", marker = "extra == 'cuda'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
