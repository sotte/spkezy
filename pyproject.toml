[project]
name = "spkezy"
version = "0.1.0"
description = "spkezy - free, open-source local AI dictation using NVIDIA NeMo Parakeet TDT 0.6B v3"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "nemo_toolkit[asr]",
  "pyaudio",
  "numpy<2.0",
  "pyperclip",
  "structlog",
  "onnx<1.18.0",
  "rich",
]

[project.optional-dependencies]
cpu = ["torch", "torchaudio", "torchvision"]
cuda = ["torch", "torchaudio", "torchvision"]

[tool.uv]
index-url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "extra == 'cpu'" },
  { index = "pytorch-cuda", marker = "extra != 'cpu'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "extra == 'cpu'" },
  { index = "pytorch-cuda", marker = "extra != 'cpu'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "extra == 'cpu'" },
  { index = "pytorch-cuda", marker = "extra != 'cpu'" },
]

[tool.hatch.build]
include = ["*.py", "sound.mp3"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.basedpyright]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportAny = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.21.0",
]
